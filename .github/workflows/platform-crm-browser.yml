name: Platform CRM browser

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - components/platform-crm.js
      - components/platform-crm.css
      - l8-html.php
      - laragon-local-entry.php
      - tests/e2e/test_platform_crm_browser_playwright.js
      - .github/workflows/platform-crm-browser.yml

permissions:
  contents: read

concurrency:
  group: platform-crm-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crm-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Hashcod
        run: |
          php -S 127.0.0.1:8099 >/tmp/hashcod-crm-browser.log 2>&1 &
          echo $! >/tmp/hashcod-crm-browser.pid
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8099/laragon-local-entry.php >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/hashcod-crm-browser.log || true
            exit 1
          fi

      - name: Click CRM icon and verify window
        env:
          CRM_TEST_URL: http://127.0.0.1:8099/laragon-local-entry.php
        run: node tests/e2e/test_platform_crm_browser_playwright.js

      - name: Stop local Hashcod
        if: always()
        run: |
          if [ -f /tmp/hashcod-crm-browser.pid ]; then
            kill "$(cat /tmp/hashcod-crm-browser.pid)" >/dev/null 2>&1 || true
          fi

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-crm-browser-log
          path: /tmp/hashcod-crm-browser.log
