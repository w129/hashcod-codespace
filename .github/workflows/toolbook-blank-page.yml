name: Verify retired Toolbook screens

on:
  pull_request:
    branches: [main]
    paths:
      - l8-html.php
      - laragon-local-entry.php
      - Dockerfile
      - .github/workflows/toolbook-blank-page.yml
  push:
    branches: [main]
    paths:
      - l8-html.php
      - laragon-local-entry.php
      - Dockerfile
      - .github/workflows/toolbook-blank-page.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Verify Toolbook is retired from active entry points
        run: |
          php -l l8-html.php
          php -l laragon-local-entry.php
          node - <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const l8=fs.readFileSync('l8-html.php','utf8');
          const local=fs.readFileSync('laragon-local-entry.php','utf8');
          const docker=fs.readFileSync('Dockerfile','utf8');

          const firstRender=l8.indexOf("echo mldsaGateHtml(l8_public_base_path(), true);");
          const oldPlatform=l8.indexOf("$toolbookReactBundlePath");
          assert(firstRender>=0,'production first-screen renderer missing');
          assert(oldPlatform<0 || firstRender<oldPlatform,'production must exit on screen 1 before old Toolbook code');

          assert(local.includes("echo mldsaGateHtml(hashcodLaragonBasePath(), true);"),'Laragon must render screen 1 only');
          assert(!local.includes('toolbook-page-blank.js'),'Laragon must not load retired Toolbook runtime');
          assert(!local.includes('toolbook-branched-menu.bundle.js'),'Laragon must not load retired BranchedMenu runtime');
          assert(!local.includes('platform-entry-hold.js'),'Laragon must not load retired second-entry runtime');
          assert(!docker.includes('cd /var/www/html/toolbook-branched-menu-build'),'production must not build retired Toolbook island');

          console.log('✓ Later Toolbook/second-entry screens are retired from active entry points');
          NODE
