name: ML-DSA-87 non-blocking access check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mldsa-access.php
      - mldsa-access-api.php
      - components/mldsa-access-gate.css
      - components/mldsa-access-gate.js
      - config/mldsa87-access-public.b64
      - l8-html.php
      - router.php
      - tests/e2e/test_mldsa_access_gate.js
      - .github/workflows/mldsa-access-gate.yml

permissions:
  contents: read

jobs:
  direct-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and static contract
        run: |
          php -l mldsa-access.php
          php -l mldsa-access-api.php
          php -l entry-product-editor.php
          php -l device-usage.php
          php -l l8-html.php
          php -l router.php
          node --check components/mldsa-access-gate.js
          node --check components/device-usage-tracker.js
          node tests/e2e/test_mldsa_access_gate.js
          node tests/e2e/test_device_usage_quota.js

      - name: Start Hashcod locally
        run: |
          php -S 127.0.0.1:8097 router.php >/tmp/mldsa-direct-entry.log 2>&1 &
          echo $! >/tmp/mldsa-direct-entry.pid
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8097/ >/tmp/hashcod-home.html; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Verify entry window appears first
        run: |
          grep -q "Acceso a Hashcod Codespace" /tmp/hashcod-home.html
          grep -q "ENTRAR A HASHCOD CODESPACE" /tmp/hashcod-home.html
          ! grep -q "Reto ML-DSA-87" /tmp/hashcod-home.html

      - name: Enter platform without cryptographic challenge
        run: |
          curl -fsSL -c /tmp/hashcod-entry.cookies -b /tmp/hashcod-entry.cookies             "http://127.0.0.1:8097/?hashcod_enter=1" >/tmp/hashcod-after.html
          ! grep -q "Acceso a Hashcod Codespace" /tmp/hashcod-after.html
          ! grep -q "Acceso criptográfico reforzado" /tmp/hashcod-after.html
          grep -qi "Hashcod" /tmp/hashcod-after.html
          curl -fsS -c /tmp/hashcod-entry.cookies -b /tmp/hashcod-entry.cookies             http://127.0.0.1:8097/ >/tmp/hashcod-return.html
          ! grep -q "Acceso a Hashcod Codespace" /tmp/hashcod-return.html

      - name: Verify ML-DSA API is non-blocking
        run: |
          curl -fsS http://127.0.0.1:8097/api/mldsa-access >/tmp/mldsa-status.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/mldsa-status.json'))
          assert d.get('ok') is True, d
          assert d.get('required') is False, d
          assert d.get('authorized') is True, d
          PY

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/mldsa-direct-entry.pid ]; then kill "$(cat /tmp/mldsa-direct-entry.pid)" || true; fi

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mldsa-direct-entry-log
          path: |
            /tmp/mldsa-direct-entry.log
            /tmp/mldsa-status.json
            /tmp/hashcod-home.html
            /tmp/hashcod-after.html
            /tmp/hashcod-return.html
