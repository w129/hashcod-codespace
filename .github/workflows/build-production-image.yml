name: Build production image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: production-container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: w129/hashcod-codespace

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: hashcod-production-candidate:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/w129/hashcod-codespace
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test complete web stack
        run: |
          set -euo pipefail
          docker run -d --name hashcod-production-smoke \
            -e PORT=8000 \
            -p 18000:8000 \
            hashcod-production-candidate:$GITHUB_SHA

          trap 'docker logs hashcod-production-smoke || true; docker rm -f hashcod-production-smoke >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:18000/healthz >/dev/null; then
              ready=1
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' hashcod-production-smoke | grep -qx true; then
              echo "Container stopped before healthz became ready."
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "healthz never became ready."
            exit 1
          fi

          root_status="$(curl --silent --show-error --max-time 15 -o /tmp/hashcod-root.html -w '%{http_code}' http://127.0.0.1:18000/)"
          echo "root_http_status=$root_status"

          case "$root_status" in
            2??|3??) ;;
            *)
              echo "Root route did not return a successful/redirect response."
              head -c 2000 /tmp/hashcod-root.html || true
              exit 1
              ;;
          esac

          if grep -qiE '502 Bad Gateway|HTTP ERROR 502' /tmp/hashcod-root.html; then
            echo "Root route contains a 502 response."
            exit 1
          fi

          # Prove that the running Caddy/PHP image serves the current entry
          # bytes, including old bookmarks and conditional browser requests.
          python3 tests/e2e/test_entry_asset_freshness.py http://127.0.0.1:18000

          # File Vault must reject use before mandatory period confirmation.
          # These checks require no provider credentials or uploaded user files.
          vault_status="$(curl --silent --show-error --max-time 15 -o /tmp/hashcod-vault.json -w '%{http_code}' http://127.0.0.1:18000/hashcod-file-vault-fast-upload.php)"
          if [ "$vault_status" != "403" ] || ! grep -q '"platform_period_required"' /tmp/hashcod-vault.json; then
            echo "File Vault upload controller did not enforce mandatory selection: $vault_status"
            exit 1
          fi
          docker exec hashcod-production-smoke node tests/e2e/test_file_vault_upload_routes.js
          docker exec hashcod-production-smoke node tests/e2e/test_file_vault_upload_feedback.js
          docker exec hashcod-production-smoke node tests/e2e/test_file_vault_direct_transfer.js
          docker exec hashcod-production-smoke node tests/e2e/test_file_vault_setup_api.js
          docker exec hashcod-production-smoke npm install --prefix /tmp/hashcod-dom-tests --no-fund --no-audit jsdom@26.1.0 fake-indexeddb@6.2.4
          docker exec -e NODE_PATH=/tmp/hashcod-dom-tests/node_modules hashcod-production-smoke node tests/e2e/test_calendar_current_date.js
          docker exec -e NODE_PATH=/tmp/hashcod-dom-tests/node_modules hashcod-production-smoke node tests/e2e/test_file_vault_setup_dialog.js
          docker exec -e NODE_PATH=/tmp/hashcod-dom-tests/node_modules hashcod-production-smoke node tests/e2e/test_file_vault_local_protection.js
          docker exec -e NODE_PATH=/tmp/hashcod-dom-tests/node_modules hashcod-production-smoke node tests/e2e/test_file_vault_device_flow.js
          docker exec -e NODE_PATH=/tmp/hashcod-dom-tests/node_modules hashcod-production-smoke node tests/e2e/test_file_vault_explorer.js
          docker exec hashcod-production-smoke test -s /var/www/html/components/file-vault-pdf/worker.js
          docker exec hashcod-production-smoke php tests/security/test-file-vault-upload.php
          docker exec hashcod-production-smoke node tests/e2e/test_file_vault_download_totp.js
          docker exec hashcod-production-smoke php tests/security/test-file-vault-download.php
          docker exec hashcod-production-smoke node tests/e2e/test_file_vault_delete_totp.js
          docker exec hashcod-production-smoke php tests/security/test-file-vault-delete.php
          docker exec hashcod-production-smoke php tests/security/test-file-vault-proxy.php
          docker exec hashcod-production-smoke node tests/e2e/test_file_vault_proxy_origin.js

          echo "Full stack smoke test passed."

      - name: Tag and push verified image
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          candidate="hashcod-production-candidate:$GITHUB_SHA"
          docker tag "$candidate" "$image:latest"
          docker tag "$candidate" "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
          docker push "$image:sha-$GITHUB_SHA"

      - name: Publish summary
        run: |
          {
            echo "## Hashcod production container"
            echo ""
            echo "- Smoke test: passed"
            echo "- Image: `ghcr.io/w129/hashcod-codespace:latest`"
            echo "- Commit tag: `ghcr.io/w129/hashcod-codespace:sha-$GITHUB_SHA`"
            echo "- Deployment: Railway tracks main; GHCR contains the verified image"
          } >> "$GITHUB_STEP_SUMMARY"
