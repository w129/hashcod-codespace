name: Verify auth utility dock

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - hashcod-sync.php
      - toolbox-secure.php
      - router.php
      - not-found.php
      - l8-html.php
      - laragon-local-entry.php
      - rare-folder-build/**
      - components/cloud-device-sync.js
      - components/admin-hello-button.js
      - components/auth-vector-layout-fix.js
      - components/auth-register-resilience.js
      - components/auth-utility-outside.css
      - components/platform-entry-slogan.js
      - components/platform-entry-capability-footer-fix.js
      - components/hashcod-ux-system.js
      - components/hashcod-ux-system.css
      - components/hashcod-ux-dark-compat.css
      - components/boot-folder-animation.js
      - components/boot-folder-animation.css
      - components/vector-image-vault.js
      - components/vector-image-vault.css
      - components/vector-classroom-board.js
      - components/vector-classroom-board.css
      - components/vector-link-board.js
      - components/vector-link-board.css
      - components/vector-tray-icon-third.svg
      - components/efr-code-editor.js
      - components/efr-code-editor.css
      - components/gods-eye-view-loader.js
      - components/gods-eye-view.js
      - components/gods-eye-view.css
      - components/mobile-platform-polish.css
      - components/toolbox-secure-links.js
      - components/toolbox-secure-links.css
      - components/toolbox-secure-ui-rescue.js
      - components/toolbox-signature-copy.js
      - components/topbar-windows-hello.js
      - components/platform-registration-form.js
      - components/platform-registration-form.css
      - supabase/schema.sql
      - supabase/migrations/20260913_create_secure_toolbox_links.sql
      - supabase/migrations/20260913_add_toolbox_access_signature_hash.sql
      - tests/e2e/test_auth_vector_layout_fix.js
      - tests/e2e/test_auth_register_resilience.js
      - tests/e2e/test_auth_vector_tray.js
      - tests/e2e/test_boot_folder_animation.js
      - tests/e2e/test_vector_image_vault.js
      - tests/e2e/test_vector_classroom_board.js
      - tests/e2e/test_vector_link_board.js
      - tests/e2e/test_efr_code_editor.js
      - tests/e2e/test_efr_browser_playwright.js
      - tests/e2e/test_gods_eye_view.js
      - tests/e2e/test_gods_eye_view_browser_playwright.js
      - tests/e2e/test_hashcod_ux_system.js
      - tests/e2e/test_hashcod_ux_browser_playwright.js
      - tests/e2e/test_mobile_platform_polish.js
      - tests/e2e/test_cloud_device_sync.js
      - tests/e2e/test_secure_toolbox_links.js
      - tests/e2e/test_platform_registration_form.js
      - .github/workflows/verify-auth-layout.yml
  pull_request:
    branches:
      - main
    paths:
      - router.php
      - not-found.php
      - l8-html.php
      - laragon-local-entry.php
      - toolbox-secure.php
      - components/toolbox-secure-links.js
      - components/toolbox-secure-links.css
      - components/toolbox-secure-ui-rescue.js
      - components/toolbox-signature-copy.js
      - components/platform-registration-form.js
      - components/platform-registration-form.css
      - supabase/schema.sql
      - components/auth-vector-layout-fix.js
      - components/auth-register-resilience.js
      - components/platform-entry-capability-footer-fix.js
      - components/hashcod-ux-system.js
      - components/hashcod-ux-system.css
      - components/hashcod-ux-dark-compat.css
      - components/efr-code-editor.js
      - components/efr-code-editor.css
      - components/gods-eye-view-loader.js
      - components/gods-eye-view.js
      - components/gods-eye-view.css
      - tests/e2e/test_efr_code_editor.js
      - tests/e2e/test_efr_browser_playwright.js
      - tests/e2e/test_gods_eye_view.js
      - tests/e2e/test_gods_eye_view_browser_playwright.js
      - tests/e2e/test_hashcod_ux_system.js
      - tests/e2e/test_hashcod_ux_browser_playwright.js
      - tests/e2e/test_secure_toolbox_links.js
      - tests/e2e/test_platform_registration_form.js
      - tests/e2e/test_auth_register_resilience.js
      - .github/workflows/verify-auth-layout.yml
  workflow_dispatch:

jobs:
  verify-auth-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Syntax check auth layout script
        run: node --check components/auth-vector-layout-fix.js

      - name: Syntax check auth registration resilience
        run: node --check components/auth-register-resilience.js

      - name: Syntax check vector tray module
        run: node --check components/platform-entry-slogan.js

      - name: Syntax check shared UX system
        run: node --check components/hashcod-ux-system.js

      - name: Syntax check EFR code editor
        run: node --check components/efr-code-editor.js

      - name: Syntax check God's Eye View loader
        run: node --check components/gods-eye-view-loader.js

      - name: Syntax check God's Eye View runtime
        run: node --check components/gods-eye-view.js

      - name: Build exact Rare UI React Motion folder
        working-directory: rare-folder-build
        run: |
          npm install --no-fund --no-audit
          npm run build 2>&1 | tee /tmp/rare-folder-build.log
          ! grep -q "suspicious-define" /tmp/rare-folder-build.log
          test -s ../components/rare-folder-entry.bundle.js
          node --check ../components/rare-folder-entry.bundle.js
          grep -q "hashcodRareFolderHost" ../components/rare-folder-entry.bundle.js

      - name: Syntax check legacy boot folder fallback
        run: node --check components/boot-folder-animation.js

      - name: Syntax check PNG vault module
        run: node --check components/vector-image-vault.js

      - name: Syntax check classroom board module
        run: node --check components/vector-classroom-board.js

      - name: Syntax check link board module
        run: node --check components/vector-link-board.js

      - name: Syntax check cloud device sync
        run: node --check components/cloud-device-sync.js

      - name: Syntax check secure Toolbox launcher
        run: node --check components/toolbox-secure-links.js

      - name: Syntax check secure Toolbox rescue layer
        run: node --check components/toolbox-secure-ui-rescue.js

      - name: Syntax check Toolbox signature copy
        run: node --check components/toolbox-signature-copy.js

      - name: Syntax check top bar Windows Hello control
        run: node --check components/topbar-windows-hello.js

      - name: Syntax check platform registration form
        run: node --check components/platform-registration-form.js

      - name: Syntax check retired registration cleanup
        run: php -l cleanup-platform-registration.php

      - name: Syntax check CodeKey admin backend
        run: php -l admin-device.php

      - name: Verify CodeKey admin contract
        run: node tests/security/test-admin-device.cjs

      - name: Syntax check cloud sync backend
        run: php -l hashcod-sync.php

      - name: Syntax check secure Toolbox backend
        run: php -l toolbox-secure.php

      - name: Syntax check PHP router
        run: php -l router.php

      - name: Syntax check branded 404
        run: php -l not-found.php

      - name: Syntax check HTML serving helper
        run: php -l l8-html.php

      - name: Syntax check Laragon entry
        run: php -l laragon-local-entry.php

      - name: Verify auth layout contract
        run: node tests/e2e/test_auth_vector_layout_fix.js

      - name: Verify account registration resilience
        run: node tests/e2e/test_auth_register_resilience.js

      - name: Verify 3D auth vector tray contract
        run: node tests/e2e/test_auth_vector_tray.js

      - name: Verify exact Rare UI folder integration
        run: node tests/e2e/test_boot_folder_animation.js

      - name: Verify PNG vault contract
        run: node tests/e2e/test_vector_image_vault.js

      - name: Verify classroom board contract
        run: node tests/e2e/test_vector_classroom_board.js

      - name: Verify 200-slot link board contract
        run: node tests/e2e/test_vector_link_board.js

      - name: Verify EFR code editor contract
        run: node tests/e2e/test_efr_code_editor.js

      - name: Verify God's Eye View sixth-cube contract
        run: node tests/e2e/test_gods_eye_view.js

      - name: Verify shared Hashcod UX contract
        run: node tests/e2e/test_hashcod_ux_system.js

      - name: Verify runtime performance contract
        run: node tests/e2e/test_runtime_performance_contract.js

      - name: Verify legacy auth window retirement
        run: node tests/e2e/test_legacy_auth_retirement.js

      - name: Verify final-screen platform registration form
        run: node tests/e2e/test_platform_registration_form.js

      - name: Install Playwright Chromium for browser verification
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify real fifth-cube click opens EFR in Chromium
        run: |
          php -S 127.0.0.1:8099 >/tmp/hashcod-efr-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:8099/laragon-local-entry.php >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Local Hashcod UI server did not become ready"
            cat /tmp/hashcod-efr-php.log || true
            exit 1
          fi
          EFR_TEST_URL=http://127.0.0.1:8099/laragon-local-entry.php node tests/e2e/test_efr_browser_playwright.js

      - name: Verify real sixth-cube click opens God's Eye View in-platform
        run: |
          php -S 127.0.0.1:8099 >/tmp/hashcod-gev-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:8099/laragon-local-entry.php >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Local Hashcod UI server did not become ready"
            cat /tmp/hashcod-gev-php.log || true
            exit 1
          fi
          GEV_TEST_URL=http://127.0.0.1:8099/laragon-local-entry.php node tests/e2e/test_gods_eye_view_browser_playwright.js

      - name: Verify shared UX in Chromium
        run: |
          php -S 127.0.0.1:8099 >/tmp/hashcod-ux-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:8099/laragon-local-entry.php >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Local Hashcod UI server did not become ready"
            cat /tmp/hashcod-ux-php.log || true
            exit 1
          fi
          UX_TEST_URL=http://127.0.0.1:8099/laragon-local-entry.php node tests/e2e/test_hashcod_ux_browser_playwright.js

      - name: Verify mobile platform polish
        run: node tests/e2e/test_mobile_platform_polish.js

      - name: Verify cross-device Supabase sync
        run: node tests/e2e/test_cloud_device_sync.js

      - name: Verify retired Toolbox circle-link contract
        run: node tests/e2e/test_secure_toolbox_links.js

      - name: Verify cryptographic card gate regression
        run: node tests/e2e/test_crypto_card_validation_gate.js
