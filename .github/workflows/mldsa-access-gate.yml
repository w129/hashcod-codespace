name: First screen React Bits BranchedMenu + security check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - mldsa-access.php
      - mldsa-access-api.php
      - pqc-actions.php
      - pqc-actions-lib.php
      - scripts/mldsa87_access.py
      - components/pqc-action-runtime.js
      - components/page-mascot-panda.js
      - components/page-mascot-panda.css
      - components/mldsa-access-gate.css
      - components/mldsa-access-gate.js
      - first-screen-branched-menu-build/**
      - center-empty-state-build/**
      - code-access-build/**
      - code-access-lib.php
      - code-access-api.php
      - tests/e2e/test_code_access_manifest.php
      - hashcod-file-vault.php
      - Dockerfile
      - components/react-bits-rotating-text.js
      - components/react-bits-rotating-text.css
      - components/animate-ui-global-cursor.js
      - components/animate-ui-global-cursor.css
      - components/book-cursor-follow.svg
      - config/mldsa87-access-public.b64
      - l8-html.php
      - router.php
      - tests/e2e/test_mldsa_access_gate.js
      - tests/e2e/test_first_screen_only_browser_playwright.js
      - tests/e2e/test_pqc_action_bus.js
      - tests/e2e/test_pqc_transition_norm.php
      - tests/e2e/test_page_mascot.js
      - .github/workflows/mldsa-access-gate.yml

permissions:
  contents: read

jobs:
  direct-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and static contract
        run: |
          php -l mldsa-access.php
          php -l mldsa-access-api.php
          php -l pqc-actions-lib.php
          php -l pqc-actions.php
          php -l l8-html.php
          php -l router.php
          php -l hashcod-file-vault.php
          php -l code-access-lib.php
          php -l code-access-api.php
          php tests/e2e/test_code_access_manifest.php
          python3 -m py_compile scripts/mldsa87_access.py
          node --check components/mldsa-access-gate.js
          node --check tests/e2e/test_first_screen_only_browser_playwright.js
          node --check components/react-bits-rotating-text.js
          node --check components/animate-ui-global-cursor.js
          node --check components/pqc-action-runtime.js
          node --check components/page-mascot-panda.js
          node tests/e2e/test_mldsa_access_gate.js
          node tests/e2e/test_pqc_action_bus.js
          node tests/e2e/test_page_mascot.js
          php tests/e2e/test_pqc_transition_norm.php

      - name: Build first-screen React Bits BranchedMenu
        working-directory: first-screen-branched-menu-build
        run: |
          npm install --no-fund --no-audit
          npm run build
          test -s ../components/first-screen-branched-menu.bundle.js
          test -s ../components/first-screen-branched-menu.bundle.css
          node --check ../components/first-screen-branched-menu.bundle.js

      - name: Build Monaco signed-code access gate
        working-directory: code-access-build
        run: |
          npm install --no-fund --no-audit
          npm run build
          test -s ../components/code-access.bundle.js
          test -s ../components/code-access.bundle.css
          test -s ../components/monaco-editor.worker.js
          node --check ../components/code-access.bundle.js
          node --check ../components/monaco-editor.worker.js

      - name: Build centered EmptyState
        working-directory: center-empty-state-build
        run: |
          npm install --no-fund --no-audit
          npm run build
          test -s ../components/center-empty-state.bundle.js
          test -s ../components/center-empty-state.bundle.css
          node --check ../components/center-empty-state.bundle.js

      - name: Install Playwright for first-screen verification
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Hashcod locally
        run: |
          L8_CODE_ACCESS_REQUIRED=0 php -S 127.0.0.1:8097 router.php >/tmp/mldsa-direct-entry.log 2>&1 &
          echo $! >/tmp/mldsa-direct-entry.pid
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8097/ >/tmp/hashcod-home.html; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Verify BranchedMenu replaced the old first-screen window
        run: |
          grep -q 'id="d5FirstBranchedMenuStage"' /tmp/hashcod-home.html
          grep -q 'id="d5FirstBranchedMenuMount"' /tmp/hashcod-home.html
          grep -q 'data-react-bits-component="BranchedMenu"' /tmp/hashcod-home.html
          grep -q 'id="d5PreviewPolicyFooter"' /tmp/hashcod-home.html
          grep -q 'id="d5PreviewPolicyMount"' /tmp/hashcod-home.html
          grep -q 'data-hashcod-component="PreviewLinkCard"' /tmp/hashcod-home.html
          grep -q 'id="d5CodeAccessMount"' /tmp/hashcod-home.html
          grep -q 'data-hashcod-component="CodeAccessGate"' /tmp/hashcod-home.html
          grep -q 'data-required="0"' /tmp/hashcod-home.html
          grep -q 'code-access.bundle.css?v=20261004-mesh-dialog1' /tmp/hashcod-home.html
          grep -q 'code-access.bundle.js?v=20261004-mesh-dialog1' /tmp/hashcod-home.html
          grep -q 'first-screen-branched-menu.bundle.css?v=20261004-preview-policy5' /tmp/hashcod-home.html
          grep -q 'first-screen-branched-menu.bundle.js?v=20261004-preview-policy5' /tmp/hashcod-home.html
          grep -q 'id="d5CenterEmptyStateStage"' /tmp/hashcod-home.html
          grep -q 'id="d5CenterEmptyStateMount"' /tmp/hashcod-home.html
          grep -q 'data-hashcod-component="EmptyState"' /tmp/hashcod-home.html
          grep -q 'center-empty-state.bundle.css?v=20261006-file-vault-delete1' /tmp/hashcod-home.html
          grep -q 'center-empty-state.bundle.js?v=20261006-file-vault-delete1' /tmp/hashcod-home.html
          ! grep -q 'class="access-card entry-access-card"' /tmp/hashcod-home.html
          ! grep -q 'id="d5VerifyText">Entrar</span>' /tmp/hashcod-home.html
          ! grep -q 'id="d5EntryStatCard"' /tmp/hashcod-home.html
          ! grep -q 'id="d5TiltCardDemo"' /tmp/hashcod-home.html
          ! grep -q 'Current price to purchase a slot' /tmp/hashcod-home.html
          ! grep -q 'id="d5SavedChatDemo"' /tmp/hashcod-home.html
          ! grep -q 'Saved Messages</h3>' /tmp/hashcod-home.html
          ! grep -q 'Acceso a Hashcod Codespace</h1>' /tmp/hashcod-home.html
          grep -q 'id="d5RotatingTextHero"' /tmp/hashcod-home.html
          grep -q '>Creates like</span>' /tmp/hashcod-home.html
          grep -q 'animate-ui-global-cursor.css?v=20261004-animate-cursor-book1' /tmp/hashcod-home.html
          grep -q 'animate-ui-global-cursor.js?v=20261004-animate-cursor-book1' /tmp/hashcod-home.html
          ! grep -q 'id="d5SplashCursorBackground"' /tmp/hashcod-home.html
          ! grep -q 'id="d5SplashCursorCanvas"' /tmp/hashcod-home.html
          grep -q 'id="d5TextEditorCard" class="liquid-text-editor" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Workspace" hidden' /tmp/hashcod-home.html
          grep -q 'id="d5WorkspaceModalBackdrop"' /tmp/hashcod-home.html
          grep -q 'id="d5TextCardBackdrop" class="text-card-modal-backdrop" hidden' /tmp/hashcod-home.html
          grep -q 'id="d5BeamCardDemo" class="beam-card-demo" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Text Card" hidden' /tmp/hashcod-home.html
          grep -q 'id="d5DocumentsHubBackdrop"' /tmp/hashcod-home.html
          grep -q 'id="d5DocumentsHubShell"' /tmp/hashcod-home.html
          grep -q 'id="d5DocumentsHubContent"' /tmp/hashcod-home.html
          ! grep -q 'platform-entry-hold.js' /tmp/hashcod-home.html
          ! grep -q 'toolbook-page-blank.js' /tmp/hashcod-home.html

      - name: Verify retired entry query keeps the BranchedMenu first screen
        run: |
          curl -fsSL "http://127.0.0.1:8097/?hashcod_enter=1" >/tmp/hashcod-after.html
          grep -q 'id="d5FirstBranchedMenuMount"' /tmp/hashcod-after.html
          ! grep -q 'class="access-card entry-access-card"' /tmp/hashcod-after.html
          ! grep -q 'platform-entry-hold.js' /tmp/hashcod-after.html
          ! grep -q 'toolbook-page-blank.js' /tmp/hashcod-after.html

      - name: Verify OCG mesh first-use binding endpoint
        run: |
          L8_CODE_ACCESS_REQUIRED=1 php -S 127.0.0.1:8098 router.php >/tmp/code-access-gate.log 2>&1 &
          echo $! >/tmp/code-access-gate.pid
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS -c /tmp/mesh.cookies http://127.0.0.1:8098/api/code-access >/tmp/mesh-state.json; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          node - <<'NODE'
          const fs=require('fs');
          const assert=require('assert/strict');
          const data=JSON.parse(fs.readFileSync('/tmp/mesh-state.json','utf8'));
          assert.equal(data.ok,true);
          assert.equal(data.required,true);
          assert.equal(data.authorized,false);
          assert.equal(data.bound,false);
          assert.equal(data.schema,'OCG.MSH.v10.119-ibAKA-QJ73o-NrdXI');
          assert.deepEqual(data.fields,['TYPE','PAYLOAD','SALT','NONCE','ISSUED','USE','CHECK']);
          NODE
          cat >/tmp/mesh-fields.json <<'JSON'
          {"fields":{"TYPE":"MESH-NODE","PAYLOAD":"ghWl-S1-4_OotRJmydmA_8kIkzQYw-GEPrIyfrTu9XK9BuXaTWmRYLWNkQpPl4C7","SALT":"0e83721b7ffe4c04e3b238656fd4d316","NONCE":"e3c51657884155c396882b9a","ISSUED":"20261004174810","USE":"distributed node credential","CHECK":"4D38EF3C"}}
          JSON
          curl -fsS -b /tmp/mesh.cookies -c /tmp/mesh.cookies             -H 'Content-Type: application/json' -H 'X-Hashcod-Mesh: 1'             --data-binary @/tmp/mesh-fields.json             http://127.0.0.1:8098/api/code-access >/tmp/mesh-enroll.json
          node - <<'NODE'
          const fs=require('fs');
          const assert=require('assert/strict');
          const data=JSON.parse(fs.readFileSync('/tmp/mesh-enroll.json','utf8'));
          assert.equal(data.ok,true);
          assert.equal(data.authorized,true);
          assert.equal(data.bound,true);
          assert.equal(data.enrolled,true);
          NODE
          curl -fsS -b /tmp/mesh.cookies http://127.0.0.1:8098/api/code-access >/tmp/mesh-bound.json
          node - <<'NODE'
          const fs=require('fs');
          const assert=require('assert/strict');
          const data=JSON.parse(fs.readFileSync('/tmp/mesh-bound.json','utf8'));
          assert.equal(data.bound,true);
          NODE
          curl -fsS -b /tmp/mesh.cookies -c /tmp/mesh.cookies             -H 'Content-Type: application/json' -H 'X-Hashcod-Mesh: 1'             --data-binary @/tmp/mesh-fields.json             http://127.0.0.1:8098/api/code-access >/tmp/mesh-match.json
          grep -q '"enrolled":false' /tmp/mesh-match.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/mesh-fields.json','utf8'));
          data.fields.CHECK='DIFFERENT-CHECK';
          fs.writeFileSync('/tmp/mesh-different.json',JSON.stringify(data));
          NODE
          status=$(curl -sS -o /tmp/mesh-mismatch.json -w '%{http_code}' -b /tmp/mesh.cookies -c /tmp/mesh.cookies             -H 'Content-Type: application/json' -H 'X-Hashcod-Mesh: 1'             --data-binary @/tmp/mesh-different.json             http://127.0.0.1:8098/api/code-access)
          test "$status" -eq 409
          grep -q '"code":"binding_mismatch"' /tmp/mesh-mismatch.json
          curl -fsS -b /tmp/mesh.cookies http://127.0.0.1:8098/ >/tmp/code-access-home.html
          grep -q 'data-hashcod-code-access-required="1"' /tmp/code-access-home.html
          grep -q 'data-hashcod-code-access-authorized="0"' /tmp/code-access-home.html
          grep -q 'data-required="1"' /tmp/code-access-home.html

      - name: Verify production blurred OCG mesh gate in Chromium
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          const values={
            TYPE:'MESH-NODE',
            PAYLOAD:'ghWl-S1-4_OotRJmydmA_8kIkzQYw-GEPrIyfrTu9XK9BuXaTWmRYLWNkQpPl4C7',
            SALT:'0e83721b7ffe4c04e3b238656fd4d316',
            NONCE:'e3c51657884155c396882b9a',
            ISSUED:'20261004174810',
            USE:'distributed node credential',
            CHECK:'4D38EF3C'
          };
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:900}});
            const page=await context.newPage();
            try{
              const response=await page.goto('http://127.0.0.1:8098/',{waitUntil:'domcontentloaded',timeout:15000});
              assert(response&&response.status()===200,'production OCG mesh gate root must return 200');
              await page.waitForSelector('#d5CodeAccessGate',{state:'visible',timeout:15000});
              await page.waitForSelector('#d5CodeAccessGate .monaco-editor',{state:'visible',timeout:15000});
              await page.waitForSelector('#d5MeshNodeIcon',{state:'visible',timeout:15000});
              const state=await page.evaluate(()=>{
                const overlay=document.querySelector('.code-access-overlay');
                const gate=document.getElementById('d5CodeAccessGate');
                const platform=document.getElementById('d5FirstBranchedMenuStage');
                const rect=gate.getBoundingClientRect();
                const style=getComputedStyle(overlay);
                return {
                  overlayPosition:style.position,
                  backdrop:style.backdropFilter||style.webkitBackdropFilter||'',
                  centerX:rect.left+rect.width/2,
                  centerY:rect.top+rect.height/2,
                  viewportX:innerWidth/2,
                  viewportY:innerHeight/2,
                  tabs:Array.from(document.querySelectorAll('#d5CodeAccessGate [role="tab"]')).map(n=>n.textContent.trim()),
                  active:document.querySelector('#d5CodeAccessGate [role="tab"][aria-selected="true"]')?.textContent?.trim()||'',
                  monaco:Boolean(document.querySelector('#d5CodeAccessGate .monaco-editor')),
                  vector:Boolean(document.querySelector('#d5MeshNodeIcon svg path')),
                  platformBehind:Boolean(platform),
                  protocol:gate.getAttribute('data-protocol')||'',
                  bound:gate.getAttribute('data-bound')||''
                };
              });
              assert.equal(state.overlayPosition,'fixed');
              assert(state.backdrop.includes('blur(20px)'),'gate must blur the platform behind it');
              assert(Math.abs(state.centerX-state.viewportX)<=3,'gate must be horizontally centered');
              assert(Math.abs(state.centerY-state.viewportY)<=20,'gate must be vertically centered');
              assert.deepEqual(state.tabs,['Access.php','Protocol']);
              assert.equal(state.active,'Access.php');
              assert.equal(state.monaco,true);
              assert.equal(state.vector,true,'provided OCG SVG path must render inside the editor');
              assert.equal(state.platformBehind,true,'platform must remain rendered behind the blurred blocker');
              assert.equal(state.protocol,'OCG.MSH.v10.119-ibAKA-QJ73o-NrdXI');
              assert.equal(state.bound,'false');

              await page.locator('#d5MeshNodeIcon').click();
              await page.waitForSelector('#d5MeshCredentialWindow',{state:'visible'});
              for(const [name,value] of Object.entries(values)){
                await page.locator('#d5MeshField'+name).fill(value);
              }
              await page.locator('#d5MeshCredentialSubmit').click();
              await page.waitForSelector('#d5CodeAccessGate',{state:'detached',timeout:10000});

              await page.reload({waitUntil:'domcontentloaded'});
              await page.waitForSelector('#d5CodeAccessGate',{state:'visible',timeout:15000});
              await page.waitForFunction(()=>document.getElementById('d5CodeAccessGate')?.getAttribute('data-bound')==='true');
              await page.locator('#d5MeshNodeIcon').click();
              for(const [name,value] of Object.entries({...values,CHECK:'DIFFERENT-CHECK'})){
                await page.locator('#d5MeshField'+name).fill(value);
              }
              await page.locator('#d5MeshCredentialSubmit').click();
              await page.waitForFunction(()=>document.querySelector('.mesh-tk-error')?.textContent?.includes('already bound'));
              assert.equal(await page.locator('#d5MeshCredentialWindow').isVisible(),true,'different credential must keep the lock window open');
            } finally {
              await browser.close();
            }
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
          kill "$(cat /tmp/code-access-gate.pid)" || true

      - name: Verify first screen in Chromium
        run: |
          HASHCOD_FIRST_SCREEN_URL=http://127.0.0.1:8097/ node tests/e2e/test_first_screen_only_browser_playwright.js

      - name: Verify Laragon renders the same BranchedMenu first screen
        run: |
          php laragon-local-entry.php >/tmp/hashcod-laragon.html
          grep -q 'id="d5FirstBranchedMenuMount"' /tmp/hashcod-laragon.html
          grep -q 'id="d5PreviewPolicyFooter"' /tmp/hashcod-laragon.html
          grep -q 'id="d5PreviewPolicyMount"' /tmp/hashcod-laragon.html
          grep -q 'id="d5CodeAccessMount"' /tmp/hashcod-laragon.html
          grep -q 'code-access.bundle.js?v=20261004-mesh-dialog1' /tmp/hashcod-laragon.html
          grep -q 'first-screen-branched-menu.bundle.js?v=20261004-preview-policy5' /tmp/hashcod-laragon.html
          grep -q 'id="d5CenterEmptyStateMount"' /tmp/hashcod-laragon.html
          grep -q 'center-empty-state.bundle.js?v=20261006-file-vault-delete1' /tmp/hashcod-laragon.html
          ! grep -q 'class="access-card entry-access-card"' /tmp/hashcod-laragon.html
          ! grep -q 'platform-entry-hold.js' /tmp/hashcod-laragon.html
          ! grep -q 'toolbook-page-blank.js' /tmp/hashcod-laragon.html

      - name: Verify panda mascot assets
        run: |
          curl -fsS http://127.0.0.1:8097/mascots/panda-directions.webp -o /tmp/panda-directions.webp
          curl -fsS http://127.0.0.1:8097/mascots/panda-reactions.webp -o /tmp/panda-reactions.webp
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              "/tmp/panda-directions.webp": "6f3f42dcf066c2b1c01e85913d2ea8828215f474",
              "/tmp/panda-reactions.webp": "aaecccbcc7aaeb646aeb2a10145d31701ada5e9e",
          }
          for path, want in expected.items():
              data = Path(path).read_bytes()
              got = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
              assert got == want, (path, got, want)
          PY

      - name: Verify ML-DSA API is non-blocking
        run: |
          curl -fsS http://127.0.0.1:8097/api/mldsa-access >/tmp/mldsa-status.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/mldsa-status.json'))
          assert d.get('ok') is True, d
          assert d.get('required') is False, d
          assert d.get('authorized') is True, d
          PY

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/mldsa-direct-entry.pid ]; then kill "$(cat /tmp/mldsa-direct-entry.pid)" || true; fi

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mldsa-direct-entry-log
          path: |
            /tmp/mldsa-direct-entry.log
            /tmp/mldsa-status.json
            /tmp/hashcod-home.html
            /tmp/hashcod-after.html
            /tmp/hashcod-return.html
