name: Security hardening checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan tracked files for secrets and runtime state
        run: |
          node --check scripts/check_secrets.js
          node scripts/check_secrets.js

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint security-sensitive PHP
        shell: bash
        run: |
          set -euo pipefail
          for file in api.php bash-engine.php security.php railway-router.php router.php entry-assets.php mldsa-access.php l8-html.php openclaw-bridge.php secrets.php resilient-proxy.php hashcod-keys.php execution-security.php agent_browser.php streamlit.php; do
            php -l "$file"
          done

      - name: Check Node server syntax
        run: |
          node --check ws-server.js
          node --check server.js
          node --check tests/security/test-critical-surface-hardening.js

      - name: Run critical security regression checks
        run: node tests/security/test-critical-surface-hardening.js
      - name: Verify external main platform runtime
        run: |
          node --check components/main-platform-runtime.js
          node tests/security/test-main-platform-runtime-external.js

      - name: Verify delayed platform loading skeleton
        run: |
          node --check components/platform-loading-skeleton.js
          node tests/e2e/test_platform_loading_skeleton.js

      - name: Verify CSP nonce HTML parser
        run: php tests/security/test-csp-nonce-injection.php

      - name: Verify isolated execution policy
        run: php tests/security/test-execution-security.php

      - name: Verify current admin boundary
        env:
          L8_VAULT_MASTER_KEY: isolated-ci-master-key-at-least-32-characters
        run: php tests/security/test-admin-device.php

      - name: Verify CSP exact origins
        run: php tests/security/test-csp-origins.php

      - name: Verify stable production key guards
        run: node tests/security/test-production-keys.js
