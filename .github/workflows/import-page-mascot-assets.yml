name: Import page-mascot panda assets

on:
  push:
    branches:
      - feat/page-mascot-panda-20260929
    paths:
      - .github/workflows/import-page-mascot-assets.yml

permissions:
  contents: write

jobs:
  import-panda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/page-mascot-panda-20260929
          fetch-depth: 0

      - name: Download exact upstream panda atlases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mascots
          curl -fsSL --retry 3 --retry-delay 2             -o mascots/panda-directions.webp             https://raw.githubusercontent.com/nilbuild/page-mascot/main/public/mascots/panda-directions.webp
          curl -fsSL --retry 3 --retry-delay 2             -o mascots/panda-reactions.webp             https://raw.githubusercontent.com/nilbuild/page-mascot/main/public/mascots/panda-reactions.webp

      - name: Verify exact uploaded asset identities
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              "mascots/panda-directions.webp": "6f3f42dcf066c2b1c01e85913d2ea8828215f474",
              "mascots/panda-reactions.webp": "aaecccbcc7aaeb646aeb2a10145d31701ada5e9e",
          }
          for path, want in expected.items():
              data = Path(path).read_bytes()
              got = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
              if got != want:
                  raise SystemExit(f"{path}: git blob mismatch: {got} != {want}")
              print(path, len(data), got)
          PY

      - name: Commit panda atlases
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hashcod-actions"
          git config user.email "actions@users.noreply.github.com"
          git add mascots/panda-directions.webp mascots/panda-reactions.webp
          if git diff --cached --quiet; then
            echo "Panda assets already present."
            exit 0
          fi
          git commit -m "assets: add page-mascot panda sprite sheets"
          git push origin HEAD:feat/page-mascot-panda-20260929
