name: Platform CRM browser

on:
  workflow_dispatch:
  pull_request:
    paths:
      - components/platform-crm.js
      - components/platform-crm.css
      - tests/e2e/test_platform_crm_browser_playwright.js
      - .github/workflows/platform-crm-browser.yml
  push:
    branches:
      - main
    paths:
      - components/platform-crm.js
      - components/platform-crm.css
      - l8-html.php
      - laragon-local-entry.php
      - tests/e2e/test_platform_crm_browser_playwright.js
      - .github/workflows/platform-crm-browser.yml

permissions:
  contents: read

concurrency:
  group: platform-crm-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crm-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify CRM component under enforced CSP
        run: node tests/e2e/test_platform_crm_browser_playwright.js
