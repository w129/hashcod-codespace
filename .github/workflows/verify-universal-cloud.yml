name: Verify universal cloud persistence

on:
  push:
    branches: [main]
    paths:
      - hashcod-workspace-access.php
      - hashcod-workspace-state.php
      - hashcod-workspace-blob.php
      - hashcod-workspace-image-vault.php
      - hashcod-file-vault.php
      - hashcod-file-vault-fast-upload.php
      - hashcod-file-vault-access-code.php
      - hashcod-shared-cloud.php
      - supabase/functions/hashcod-shared-cloud/**
      - supabase/migrations/**
      - components/universal-cloud-persistence.js
      - components/product-image-cloud-sync.js
      - components/workspace-image-vault-sync.js
      - components/workspace-media-bootstrap.js
      - components/mldsa-access-gate-loader.js
      - components/mldsa-access-gate.js
      - components/file-vault-fast-upload-v4.js
      - components/file-vault-fast-upload-v5.js
      - components/file-vault-commit-recovery.js
      - components/file-vault-totp.css
      - file-vault-totp-build/**
      - center-empty-state-build/**
      - first-screen-branched-menu-build/**
      - mldsa-access.php
      - components/first-screen-mobile.css
      - tests/e2e/test_first_screen_mobile_browser.js
      - tests/e2e/test_file_vault_explorer.js
      - tests/e2e/test_file_vault_explorer_browser.js
      - tests/e2e/test_file_vault_loading.js
      - tools/file-vault-totp/**
      - Dockerfile
      - tests/e2e/test_cloud_device_sync.js
      - tests/e2e/test_open_platform_entry.js
      - tests/e2e/test_file_vault_totp.js
      - tests/e2e/test_file_vault_setup_dialog.js
      - tests/e2e/test_file_vault_setup_api.js
      - tests/e2e/test_file_vault_local_protection.js
      - tests/e2e/test_file_vault_device_flow.js
      - tests/e2e/test_file_vault_fast_upload.js
      - tests/e2e/test_file_vault_commit_recovery.js
      - tests/e2e/test_shared_workspace_contract.js
      - tests/e2e/test_shared_cloud_proxy.js
      - .github/workflows/verify-universal-cloud.yml
  pull_request:
    branches: [main]
    paths:
      - hashcod-workspace-access.php
      - hashcod-workspace-state.php
      - hashcod-workspace-blob.php
      - hashcod-workspace-image-vault.php
      - hashcod-file-vault.php
      - hashcod-file-vault-fast-upload.php
      - hashcod-file-vault-access-code.php
      - hashcod-shared-cloud.php
      - supabase/functions/hashcod-shared-cloud/**
      - supabase/migrations/**
      - components/universal-cloud-persistence.js
      - components/product-image-cloud-sync.js
      - components/workspace-image-vault-sync.js
      - components/workspace-media-bootstrap.js
      - components/mldsa-access-gate-loader.js
      - components/mldsa-access-gate.js
      - components/file-vault-fast-upload-v4.js
      - components/file-vault-fast-upload-v5.js
      - components/file-vault-commit-recovery.js
      - components/file-vault-totp.css
      - file-vault-totp-build/**
      - center-empty-state-build/**
      - first-screen-branched-menu-build/**
      - mldsa-access.php
      - components/first-screen-mobile.css
      - tests/e2e/test_first_screen_mobile_browser.js
      - tests/e2e/test_file_vault_explorer.js
      - tests/e2e/test_file_vault_explorer_browser.js
      - tests/e2e/test_file_vault_loading.js
      - tools/file-vault-totp/**
      - Dockerfile
      - tests/e2e/test_cloud_device_sync.js
      - tests/e2e/test_open_platform_entry.js
      - tests/e2e/test_file_vault_totp.js
      - tests/e2e/test_file_vault_setup_dialog.js
      - tests/e2e/test_file_vault_setup_api.js
      - tests/e2e/test_file_vault_local_protection.js
      - tests/e2e/test_file_vault_device_flow.js
      - tests/e2e/test_file_vault_fast_upload.js
      - tests/e2e/test_file_vault_commit_recovery.js
      - tests/e2e/test_shared_workspace_contract.js
      - tests/e2e/test_shared_cloud_proxy.js
      - .github/workflows/verify-universal-cloud.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        run: |
          php -l hashcod-workspace-access.php
          php -l hashcod-workspace-state.php
          php -l hashcod-workspace-blob.php
          php -l hashcod-workspace-image-vault.php
          php -l hashcod-file-vault.php
          php -l hashcod-file-vault-fast-upload.php
          php -l hashcod-shared-cloud.php

      - name: JavaScript syntax
        run: |
          node --check components/mldsa-access-gate.js
          node --check components/universal-cloud-persistence.js
          node --check components/product-image-cloud-sync.js
          node --check components/workspace-image-vault-sync.js
          node --check components/workspace-media-bootstrap.js
          node --check components/mldsa-access-gate-loader.js
          node --check components/file-vault-fast-upload-v4.js
          node --check components/file-vault-fast-upload-v5.js
          node --check components/file-vault-commit-recovery.js
          node --check tests/e2e/test_open_platform_entry.js
          node --check tests/e2e/test_file_vault_totp.js
          node --check tests/e2e/test_file_vault_fast_upload.js
          node --check tests/e2e/test_file_vault_commit_recovery.js
          node --check tests/e2e/test_shared_workspace_contract.js

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: tools/file-vault-totp/go.mod

      - name: pquerna OTP helper
        run: |
          cd tools/file-vault-totp
          go mod tidy
          go test ./...
          go build ./...

      - name: Direct platform entry contract
        run: node tests/e2e/test_open_platform_entry.js

      - name: Shared workspace cross-device contract
        run: node tests/e2e/test_shared_workspace_contract.js

      - name: Shared cloud PHP transfer regression
        run: node tests/e2e/test_shared_cloud_proxy.js

      - name: File Vault TOTP contract
        run: node tests/e2e/test_file_vault_totp.js

      - name: File Vault uploader TOTP download behavior
        run: node tests/e2e/test_file_vault_download_totp.js

      - name: File Vault uploader TOTP delete behavior
        run: node tests/e2e/test_file_vault_delete_totp.js

      - name: File Vault fixed access-code security
        run: |
          php tests/security/test-file-vault-access-code.php
          php tests/security/test-file-vault-download.php
          php tests/security/test-file-vault-delete.php

      - name: File Vault fast upload contract
        run: node tests/e2e/test_file_vault_fast_upload.js

      - name: File Vault encrypted device fallback
        run: |
          npm install --prefix file-vault-totp-build --no-fund --no-audit
          npm run build --prefix file-vault-totp-build
          npm install --prefix center-empty-state-build --no-fund --no-audit
          npm run build --prefix center-empty-state-build
          npm install --prefix first-screen-branched-menu-build --no-fund --no-audit
          npm run build --prefix first-screen-branched-menu-build
          npm install --prefix "$RUNNER_TEMP/hashcod-dom-tests" --no-fund --no-audit jsdom@26.1.0 fake-indexeddb@6.2.4
          export NODE_PATH="$RUNNER_TEMP/hashcod-dom-tests/node_modules"
          node tests/e2e/test_file_vault_local_protection.js
          node tests/e2e/test_file_vault_device_flow.js
          node tests/e2e/test_file_vault_explorer.js
          node tests/e2e/test_file_vault_loading.js
          node tests/e2e/test_file_vault_direct_transfer.js

      - name: Protected Files explorer in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/hashcod-browser-tests" --no-fund --no-audit playwright@1.62.1
          node "$RUNNER_TEMP/hashcod-browser-tests/node_modules/playwright/cli.js" install --with-deps chromium
          export NODE_PATH="$RUNNER_TEMP/hashcod-browser-tests/node_modules"
          export HFV_SCREENSHOT_DIR="$RUNNER_TEMP/hashcod-files-evidence"
          node tests/e2e/test_file_vault_explorer_browser.js

      - name: First-screen phone layout and protected file preview
        run: |
          export NODE_PATH="$RUNNER_TEMP/hashcod-browser-tests/node_modules"
          export HASHCOD_MOBILE_SCREENSHOT_DIR="$RUNNER_TEMP/hashcod-mobile-evidence"
          node tests/e2e/test_first_screen_mobile_browser.js

      - name: Upload first-screen phone evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-screen-mobile
          path: ${{ runner.temp }}/hashcod-mobile-evidence/
          if-no-files-found: ignore

      - name: Upload protected Files visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-files-preview
          path: ${{ runner.temp }}/hashcod-files-evidence/
          if-no-files-found: ignore

      - name: File Vault commit recovery contract
        run: node tests/e2e/test_file_vault_commit_recovery.js

      - name: Cross-device contract
        run: node tests/e2e/test_cloud_device_sync.js
