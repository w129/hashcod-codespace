name: Verify blank Toolbook page

on:
  pull_request:
    branches: [main]
    paths:
      - l8-html.php
      - laragon-local-entry.php
      - components/toolbook-page-blank.js
      - components/toolbook-page-blank.css
      - tests/e2e/test_toolbook_blank_page_browser_playwright.js
      - .github/workflows/toolbook-blank-page.yml
  push:
    branches: [main]
    paths:
      - l8-html.php
      - laragon-local-entry.php
      - components/toolbook-page-blank.js
      - components/toolbook-page-blank.css
      - tests/e2e/test_toolbook_blank_page_browser_playwright.js
      - .github/workflows/toolbook-blank-page.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          php -l l8-html.php
          php -l laragon-local-entry.php
          node --check components/toolbook-page-blank.js
          node --check tests/e2e/test_toolbook_blank_page_browser_playwright.js
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify blank page
        run: |
          php -S 127.0.0.1:8099 >/tmp/hashcod-blank.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8099/laragon-local-entry.php >/dev/null; then break; fi
            sleep 1
          done
          TOOLBOOK_BLANK_TEST_URL=http://127.0.0.1:8099/laragon-local-entry.php node tests/e2e/test_toolbook_blank_page_browser_playwright.js
