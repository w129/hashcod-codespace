<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hashcod Codespace</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#fff;color:#111;font-family:Inter,"Segoe UI",Arial,sans-serif;overflow:hidden}
#bootCliOverlay{position:fixed;inset:0;background:#fff;overflow:hidden}
.splash-brand{position:absolute;left:62%;top:50%;transform:translate(-50%,-50%);width:min(430px,38vw);min-width:290px;z-index:10}
.boot-brand{display:flex;align-items:center;gap:18px;width:max-content;min-width:300px;padding:8px 0}
.brand-icon{width:54px;height:54px;display:block;flex:0 0 auto}
.brand-copy{display:flex;flex-direction:column;gap:2px}
.brand-title{font-size:32px;line-height:1;font-weight:750;letter-spacing:-1.4px;color:#000}
.brand-subtitle{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#747474;font-weight:600}
.splash-status{margin:24px 0 0 72px;width:min(330px,32vw);font-size:13px;line-height:1.55;color:#626262}
.splash-progress{margin:17px 0 0 72px;width:min(330px,32vw);height:2px;background:#e9e9e9;overflow:hidden;border-radius:20px}
.splash-progress::after{content:"";display:block;width:38%;height:100%;background:#111;animation:hashcod-progress 1.15s ease-in-out infinite}
.splash-note{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-size:11px;letter-spacing:.08em;color:#a0a0a0;white-space:nowrap}
@keyframes hashcod-progress{0%{transform:translateX(-115%)}100%{transform:translateX(325%)}}
@media(max-width:900px){.splash-brand{left:50%;top:69%;width:82vw;min-width:0;text-align:center}.boot-brand{margin:0 auto;min-width:0}.splash-status,.splash-progress{margin-left:auto;margin-right:auto;width:min(360px,76vw)}}
</style>
</head>
<body>
<div id="bootCliOverlay" aria-label="Iniciando Hashcod Codespace">
  <main class="splash-brand">
    <div class="boot-brand" data-hashcod-brand="true">
      <svg class="brand-icon" viewBox="0 0 500 500" fill="none" aria-hidden="true">
        <path d="M124 347H76C59.43 347 46 333.57 46 317V97C46 80.43 59.43 67 76 67H425C441.57 67 455 80.43 455 97V317C455 333.57 441.57 347 425 347H378" stroke="#000" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M242.5 278.5C246.2 272.1 255.8 272.1 259.5 278.5L373.5 450.2C377.5 456.9 372.7 460 365 460H137C129.3 460 124.5 456.9 128.5 450.2Z" fill="#000"/>
      </svg>
      <div class="brand-copy">
        <div class="brand-title">Hashcod</div>
        <div class="brand-subtitle">Codespace Desktop</div>
      </div>
    </div>
    <p class="splash-status" id="splashStatus">Preparando la aplicación local…</p>
    <div class="splash-progress" aria-hidden="true"></div>
  </main>
  <div class="splash-note">LOCAL DESKTOP ENVIRONMENT</div>
</div>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const message=params.get('message');
  if(message){document.getElementById('splashStatus').textContent=message;}

  function pulseFolder(){
    const folder=document.querySelector('[data-slot="folder"]');
    if(!folder){setTimeout(pulseFolder,120);return;}
    try{folder.dispatchEvent(new MouseEvent('mouseover',{bubbles:true}));}catch(_){ }
    setTimeout(function(){try{folder.click();}catch(_){ }},380);
    setTimeout(function(){try{folder.click();}catch(_){ }},1450);
  }
  setTimeout(pulseFolder,320);
})();
</script>
<script src="./rare-folder-entry.bundle.js"></script>
</body>
</html>
