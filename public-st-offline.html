<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Streamlit offline · l8 codespace</title>
  <style>
    body { margin: 0; font-family: ui-monospace, "IBM Plex Mono", monospace; background: #fff; color: #111; }
    main { max-width: 34rem; margin: 12vh auto; padding: 1.5rem; }
    h1 { font-size: 1.15rem; margin: 0 0 .5rem; }
    p { font-size: .85rem; line-height: 1.45; color: #444; margin: 0 0 .75rem; }
    code { background: #f3f3f3; padding: .1rem .35rem; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Streamlit no está en marcha</h1>
    <p>Este slot (<code>/st/…</code>) no tiene el proceso activo en el puerto local. No es un fallo de la plataforma completa.</p>
    <p>En <strong>l8 codespace</strong> abre el dock de Streamlit y pulsa <strong>Open</strong> o <strong>Preview</strong> para arrancarlo otra vez (tras un redeploy de Render hay que volver a iniciar).</p>
  </main>
</body>
</html>
