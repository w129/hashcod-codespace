services:
  - type: web
    name: hashcod-codespace-1
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: caddy run --config /var/www/html/Caddyfile --adapter caddyfile
    plan: free
    region: oregon
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: l8-storage
      - key: CF_TURNSTILE_SITE_KEY
        sync: false
      - key: CF_TURNSTILE_SECRET_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ORIGINKIT_API_KEY
        sync: false
      - key: L8_DILITHIUM5_REGISTER_KEY
        sync: false
      - key: L8_AUTH_PEPPER
        sync: false
      - key: L8_VAULT_MASTER_KEY
        sync: false
      - key: L8_DATA_ENCRYPTION_KEY
        sync: false
      - key: OPENCLAW_WEBHOOK_SECRET
        sync: false
      - key: WS_SECRET
        sync: false
      - key: WS_ALLOWED_ORIGINS
        value: https://hashcod-codespace-1.onrender.com
