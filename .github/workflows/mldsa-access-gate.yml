name: ML-DSA-87 non-blocking access check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mldsa-access.php
      - mldsa-access-api.php
      - pqc-actions.php
      - pqc-actions-lib.php
      - scripts/mldsa87_access.py
      - components/pqc-action-runtime.js
      - components/page-mascot-panda.js
      - components/page-mascot-panda.css
      - components/mldsa-access-gate.css
      - components/mldsa-access-gate.js
      - components/react-bits-rotating-text.js
      - components/react-bits-rotating-text.css
      - config/mldsa87-access-public.b64
      - l8-html.php
      - router.php
      - tests/e2e/test_mldsa_access_gate.js
      - tests/e2e/test_pqc_action_bus.js
      - tests/e2e/test_pqc_transition_norm.php
      - tests/e2e/test_page_mascot.js
      - .github/workflows/mldsa-access-gate.yml

permissions:
  contents: read

jobs:
  direct-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and static contract
        run: |
          php -l mldsa-access.php
          php -l mldsa-access-api.php
          php -l entry-product-editor.php
          php -l device-usage.php
          php -l pqc-actions-lib.php
          php -l pqc-actions.php
          php -l l8-html.php
          php -l router.php
          python3 -m py_compile scripts/mldsa87_access.py
          node --check components/mldsa-access-gate.js
          node --check components/react-bits-rotating-text.js
          node --check components/device-usage-tracker.js
          node --check components/pqc-action-runtime.js
          node --check components/page-mascot-panda.js
          node tests/e2e/test_mldsa_access_gate.js
          node tests/e2e/test_device_usage_quota.js
          node tests/e2e/test_pqc_action_bus.js
          node tests/e2e/test_page_mascot.js
          php tests/e2e/test_pqc_transition_norm.php

      - name: Start Hashcod locally
        run: |
          php -S 127.0.0.1:8097 router.php >/tmp/mldsa-direct-entry.log 2>&1 &
          echo $! >/tmp/mldsa-direct-entry.pid
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8097/ >/tmp/hashcod-home.html; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Verify entry window appears first
        run: |
          grep -q "Acceso a Hashcod Codespace" /tmp/hashcod-home.html
          grep -q ">Entrar</span>" /tmp/hashcod-home.html
          grep -q 'id="d5RotatingTextHero"' /tmp/hashcod-home.html
          grep -q 'data-texts="code|dev|programing|llm|deeplearming|data structures|algorithms|schemas|vectors|graphs|trees|hash maps"' /tmp/hashcod-home.html
          grep -q '>Creates like</span>' /tmp/hashcod-home.html
          ! grep -q "Reto ML-DSA-87" /tmp/hashcod-home.html

      - name: Enter platform without cryptographic challenge
        run: |
          curl -fsSL -c /tmp/hashcod-entry.cookies -b /tmp/hashcod-entry.cookies             "http://127.0.0.1:8097/?hashcod_enter=1" >/tmp/hashcod-after.html
          ! grep -q "Acceso a Hashcod Codespace" /tmp/hashcod-after.html
          ! grep -q "Acceso criptográfico reforzado" /tmp/hashcod-after.html
          grep -qi "Hashcod" /tmp/hashcod-after.html
          curl -fsS -c /tmp/hashcod-entry.cookies -b /tmp/hashcod-entry.cookies             http://127.0.0.1:8097/ >/tmp/hashcod-return.html
          grep -q "Acceso a Hashcod Codespace" /tmp/hashcod-return.html

      - name: Verify panda mascot assets
        run: |
          curl -fsS http://127.0.0.1:8097/mascots/panda-directions.webp -o /tmp/panda-directions.webp
          curl -fsS http://127.0.0.1:8097/mascots/panda-reactions.webp -o /tmp/panda-reactions.webp
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              "/tmp/panda-directions.webp": "6f3f42dcf066c2b1c01e85913d2ea8828215f474",
              "/tmp/panda-reactions.webp": "aaecccbcc7aaeb646aeb2a10145d31701ada5e9e",
          }
          for path, want in expected.items():
              data = Path(path).read_bytes()
              got = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
              assert got == want, (path, got, want)
          PY

      - name: Verify ML-DSA API is non-blocking
        run: |
          curl -fsS http://127.0.0.1:8097/api/mldsa-access >/tmp/mldsa-status.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/mldsa-status.json'))
          assert d.get('ok') is True, d
          assert d.get('required') is False, d
          assert d.get('authorized') is True, d
          PY

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/mldsa-direct-entry.pid ]; then kill "$(cat /tmp/mldsa-direct-entry.pid)" || true; fi

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mldsa-direct-entry-log
          path: |
            /tmp/mldsa-direct-entry.log
            /tmp/mldsa-status.json
            /tmp/hashcod-home.html
            /tmp/hashcod-after.html
            /tmp/hashcod-return.html
