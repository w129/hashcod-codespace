name: Verify registration sequence

on:
  push:
    branches:
      - main
    paths:
      - components/platform-registration-form.js
      - components/platform-registration-form.css
      - components/entry-registration-force.js
      - components/codespace-security-monitor.js
      - registration-flip-build/**
      - Dockerfile
      - supabase.php
      - security.php
      - cloudflare-turnstile.php
      - platform-registration-contract.php
      - privacy.php
      - supabase/schema.sql
      - legal-evidence/registration-evidence-manifest.json
      - components/platform-entry-hold.js
      - components/platform-entry-hold.css
      - components/platform-entry-motion.js
      - components/admin-hello-button.js
      - l8-html.php
      - laragon-local-entry.php
      - tests/e2e/test_platform_registration_form.js
      - tests/e2e/test_platform_registration_sequence_playwright.js
      - tests/e2e/test_temporary_access_playwright.js
      - .github/workflows/verify-registration-sequence.yml
  pull_request:
    branches:
      - main
    paths:
      - components/platform-registration-form.js
      - components/platform-registration-form.css
      - components/entry-registration-force.js
      - components/codespace-security-monitor.js
      - registration-flip-build/**
      - Dockerfile
      - platform-registration-contract.php
      - privacy.php
      - supabase/schema.sql
      - legal-evidence/registration-evidence-manifest.json
      - components/platform-entry-hold.js
      - components/platform-entry-hold.css
      - components/admin-hello-button.js
      - l8-html.php
      - laragon-local-entry.php
      - tests/e2e/test_platform_registration_form.js
      - tests/e2e/test_platform_registration_sequence_playwright.js
      - tests/e2e/test_temporary_access_playwright.js
      - .github/workflows/verify-registration-sequence.yml
  workflow_dispatch:

jobs:
  real-registration-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build official Animate UI FlipButton
        working-directory: registration-flip-build
        run: |
          npm install --no-fund --no-audit
          npm run build
          test -s ../components/registration-flip.bundle.js

      - name: Syntax check registration and entry scripts
        run: |
          node --check components/platform-registration-form.js
          node --check components/entry-registration-force.js
          node --check components/platform-entry-hold.js
          php -l l8-html.php
          php -l laragon-local-entry.php
          php -l privacy.php
          php -l platform-registration-contract.php
          php -l cleanup-platform-registration.php
          node tests/e2e/test_platform_entry_hold.js
          node tests/e2e/test_platform_registration_form.js
          node --check tests/e2e/test_platform_registration_sequence_playwright.js
          node --check tests/e2e/test_temporary_access_playwright.js

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify real three-screen flow
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8099 laragon-router.php >/tmp/hashcod-registration-sequence.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if ! kill -0 "$server_pid" >/dev/null 2>&1; then
              echo "Hashcod test server exited before becoming ready"
              cat /tmp/hashcod-registration-sequence.log || true
              exit 1
            fi

            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8099/laragon-local-entry.php >/tmp/hashcod-registration-ready.html; then
              ready=1
              break
            fi

            echo "Waiting for local PHP server on 127.0.0.1:8099 ($attempt/60)…"
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Hashcod test server did not become ready"
            cat /tmp/hashcod-registration-sequence.log || true
            exit 1
          fi

          REGISTRATION_SEQUENCE_URL=http://127.0.0.1:8099/laragon-local-entry.php node tests/e2e/test_platform_registration_sequence_playwright.js || {
            cat /tmp/hashcod-registration-sequence.log || true
            exit 1
          }

          TEMPORARY_ACCESS_URL=http://127.0.0.1:8099/laragon-local-entry.php node tests/e2e/test_temporary_access_playwright.js || {
            cat /tmp/hashcod-registration-sequence.log || true
            exit 1
          }

  live-registration-sequence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check public deployment wiring as advisory only
        env:
          LIVE_URL: https://hashcodcodespace.dev/
        run: |
          set +e
          html="$(curl --compressed --silent --show-error --max-time 20 "$LIVE_URL" 2>/tmp/hashcod-live-curl.log || true)"
          curl_status=$?

          echo "Live curl status: $curl_status"
          if [ -s /tmp/hashcod-live-curl.log ]; then
            echo "Live curl diagnostics:"
            cat /tmp/hashcod-live-curl.log || true
          fi

          has_hold=0
          has_motion=0
          has_monitor=0
          [[ "$html" == *"platform-entry-hold.js"* ]] && has_hold=1
          [[ "$html" == *"platform-entry-motion.js"* ]] && has_motion=1
          [[ "$html" == *"codespace-security-monitor.js"* ]] && has_monitor=1

          echo "public_entry_hold=$has_hold"
          echo "public_entry_motion=$has_motion"
          echo "public_security_monitor=$has_monitor"

          if [ "$has_hold" -eq 1 ] && [ "$has_motion" -eq 1 ] && [ "$has_monitor" -eq 1 ]; then
            echo "Public deployment is serving the entry wiring."
          else
            echo "Public deployment has not caught up yet. This is advisory and will not fail CI."
          fi

          exit 0
