name: keepalive-render
on:
  schedule:
    # Cada 10 min (GitHub puede retrasar crons en repos free)
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render + touch SEO files
        run: |
          set -e
          UA='l8-codespace-keepalive'
          for path in /robots.txt /sitemap.xml /; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -A "$UA" --max-time 60 "https://l8-codespace-1.onrender.com${path}" || echo 000)
            echo "$path -> $code"
          done
